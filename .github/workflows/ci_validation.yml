name: NetDevOps CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compileall Syntax Validation
        run: python -m compileall .
      - name: Run Black Linting Check
        run: |
          pip install black
          black --check .
